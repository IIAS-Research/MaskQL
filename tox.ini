[tox]
env_list = int
requires = tox>=4

[testenv:int]
description = Run the full suite against an isolated stack, then collect logs and clean up
package = skip
skip_install = true
basepython = python3
passenv =
    DOCKER_HOST
    DOCKER_CONTEXT
    JAVA_HOME
    HF_TOKEN
    KEEP_TEST_STACK
setenv =
    COMPOSE_PROJECT_NAME={env:MASKQL_TEST_PROJECT:maskql-tox}
    MASKQL_TEST_WORK_DIR={env_tmp_dir}
    MASKQL_HOST=localhost
    MASKQL_PORT={env:MASKQL_TEST_PORT:8443}
    MASKQL_HTTPS_PORT={env:MASKQL_TEST_PORT:8443}
    POSTGRES_HOST=localhost
    POSTGRES_PORT={env:MASKQL_TEST_POSTGRES_PORT:15432}
    POSTGRES_USER=postgres
    POSTGRES_PASSWORD=postgres
    MASKQL_ADMIN_USER=admin
    MASKQL_ADMIN_PASSWORD=admin
    MASKQL_ENCRYPT_PASSWORD=change-me-16+chars
    API_VERIFY_SSL=false
    TRINO_VERIFY_SSL=false
allowlist_externals = uv
commands_pre =
    uv run --frozen python scripts/test_stack.py start
commands =
    uv run --frozen python -m unittest discover -v tests
commands_post =
    uv run --frozen python scripts/test_stack.py stop
